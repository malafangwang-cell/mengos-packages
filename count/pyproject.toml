[project]
name = "mengos-count"
version = "0.2.1"
description = "mengos count（工程文件读取器）：行式数据与附件文件的确定性计数、乘积串与连续链、清单覆盖核对、两数互证（process 执行器；按文件读时用带入的解析库 mengos-cad）"
requires-python = ">=3.11"
# 解析库 mengos-cad 的运行时依赖，版本与 requirements-cad.txt（随解析库带入，逐字节同存储服务）一致，测试钉住
dependencies = [
  "ezdxf==1.4.5",
  "fonttools==4.68.0",
  "numpy==2.4.6",
  "pyparsing==3.3.3",
  "typing_extensions==4.16.0",
]

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4"]
